aid: kapwing
name: Kapwing
description: >-
  Kapwing is a browser-based, AI-powered video creation platform used by more
  than 30 million creators and creative teams to generate, edit, caption,
  translate, dub, and repurpose video from a single prompt. Core tools include a
  drag-and-drop video and audio editor, subtitle and transcription generation,
  text-to-speech and dubbing in 40+ languages, a prompt-to-video generator,
  smart cut and clean audio, B-roll generation, and a repurpose studio for
  turning long videos into social clips. Kapwing (San Francisco, CA) is backed
  by CRV. It does not publish a public REST API; its developer surface is the
  official Kapwing Plugin API (the @kapwing/plugin-helpers npm package), which
  lets whitelisted plugins add media to the Kapwing editor canvas.
